name: TradeFlow CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:15-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: tradeflow
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tradeflow_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,postgres]
      - name: Run Ruff
        run: ruff check .
      - name: Run Mypy
        run: mypy app
        working-directory: backend
      - name: Run Pytest (including Golden Benchmark)
        env:
          TRADEFLOW_CELERY_BROKER_URL: redis://localhost:6379/0
          TRADEFLOW_CELERY_RESULT_BACKEND: redis://localhost:6379/0
          TRADEFLOW_JOB_EXECUTOR: celery
          TRADEFLOW_DATABASE_URL: postgresql+psycopg://tradeflow:password@localhost:5432/tradeflow_test
        run: |
          alembic upgrade head
          pytest
        working-directory: backend

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run Build
        run: npm run build
