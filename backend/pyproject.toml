[project]
name = "tradeflow-backend"
version = "0.1.0"
description = "FastAPI backend and processing engine for TradeFlow."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "rapidfuzz>=3.9.3",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "alembic>=1.13.0",
    "argon2-cffi>=23.1.0",
    "PyJWT[crypto]>=2.8.0",
    "email-validator>=2.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest-asyncio>=0.23.0",
]
postgres = [
    "psycopg[binary]>=3.1.0",
]
storage = [
    "boto3>=1.34.0",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-p", "no:cacheprovider", "--basetemp=.pytest_tmp"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
